<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
<title id="t">Division with decimals</title><desc id="d">A decimal division example transformed by multiplying both numbers by ten.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8e9"/><stop offset="1" stop-color="#f1dfbd"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fffaf0"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#614d2f" flood-opacity=".18"/></filter>
</defs>
<rect width="720" height="420" rx="34" fill="url(#bg)"/>
<g opacity=".18" stroke="#b88d52" stroke-width="2"><path d="M0 80h720M0 160h720M0 240h720M0 320h720"/><path d="M90 0v420M180 0v420M270 0v420M360 0v420M450 0v420M540 0v420M630 0v420"/></g>
<rect x="54" y="62" width="612" height="296" rx="28" fill="url(#card)" stroke="#cfa45f" stroke-width="4" filter="url(#sh)"/>
<text x="360" y="125" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-weight="900" font-size="34" fill="#5b4630">DIVISION WITH DECIMALS</text>
<g font-family="Trebuchet MS,Arial,sans-serif" font-weight="900" fill="#23252a">
  <text x="360" y="210" text-anchor="middle" font-size="58">4.8 ÷ 0.6</text>
  <path d="M260 240 C310 270 410 270 460 240" fill="none" stroke="#2f65d9" stroke-width="8" stroke-linecap="round"/>
  <path d="M452 232l16 4-10 14" fill="none" stroke="#2f65d9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="316" text-anchor="middle" font-size="52">48 ÷ 6 = <tspan fill="#16864b">8</tspan></text>
</g>
<g font-family="Trebuchet MS,Arial,sans-serif" font-weight="900" font-size="24" fill="#2f65d9"><text x="176" y="264">×10</text><text x="500" y="264">×10</text></g>
</svg>