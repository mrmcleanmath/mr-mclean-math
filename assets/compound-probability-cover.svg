<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Compound probability tree diagram</title><desc id="desc">A colorful two-stage probability tree showing independent and dependent paths.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2ecff"/><stop offset="1" stop-color="#dceeff"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#36445a" flood-opacity=".18"/></filter></defs>
  <rect width="640" height="360" rx="34" fill="url(#bg)"/>
  <g filter="url(#sh)"><rect x="34" y="32" width="572" height="296" rx="28" fill="#fff"/></g>
  <text x="320" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="900" fill="#3f3a69">COMPOUND PROBABILITY</text>
  <g stroke="#6a64a9" stroke-width="7" stroke-linecap="round">
    <path d="M320 118 L190 188"/><path d="M320 118 L450 188"/><path d="M190 188 L115 273"/><path d="M190 188 L255 273"/><path d="M450 188 L385 273"/><path d="M450 188 L525 273"/>
  </g>
  <g font-family="Arial,sans-serif" font-weight="900" text-anchor="middle">
    <circle cx="320" cy="118" r="17" fill="#8a6ac6"/><circle cx="190" cy="188" r="19" fill="#ef6a6a"/><circle cx="450" cy="188" r="19" fill="#5b9fc2"/>
    <circle cx="115" cy="273" r="18" fill="#ef6a6a"/><circle cx="255" cy="273" r="18" fill="#5b9fc2"/><circle cx="385" cy="273" r="18" fill="#ef6a6a"/><circle cx="525" cy="273" r="18" fill="#5b9fc2"/>
    <g fill="#453b62" font-size="19"><text x="246" y="145">3/5</text><text x="394" y="145">2/5</text><text x="146" y="230">2/4</text><text x="229" y="230">2/4</text><text x="410" y="230">3/4</text><text x="493" y="230">1/4</text></g>
  </g>
  <g font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="#697187"><rect x="72" y="297" width="206" height="24" rx="12" fill="#f3f0fb"/><text x="175" y="314" text-anchor="middle">INDEPENDENT</text><rect x="362" y="297" width="206" height="24" rx="12" fill="#eef6fb"/><text x="465" y="314" text-anchor="middle">DEPENDENT</text></g>
</svg>
