<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230"><rect width="420" height="230" rx="24" fill="#eef8e9"/><g font-family="Trebuchet MS,Arial,sans-serif" text-anchor="middle"><text x="210" y="70" font-size="39" font-weight="900" fill="#27372b">3x + 5</text><text x="210" y="112" font-size="22" font-weight="900" fill="#55705b">Given: x = 4</text><path d="M100 134 H320" stroke="#76ad67" stroke-width="4" stroke-linecap="round"/><text x="210" y="176" font-size="31" font-weight="900" fill="#27372b">3(4) + 5 = 17</text><text x="210" y="213" font-size="20" font-weight="900" fill="#4f963f">SUBSTITUTE • CALCULATE</text></g></svg>