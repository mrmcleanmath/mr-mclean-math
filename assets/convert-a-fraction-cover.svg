<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Convert a Fraction</title><desc id="d">A fraction converting to a decimal and a percent.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#dcecff"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".16"/></filter></defs><rect width="800" height="450" rx="34" fill="url(#bg)"/><circle cx="690" cy="72" r="96" fill="#ffffff" opacity=".42"/><circle cx="96" cy="390" r="128" fill="#ffffff" opacity=".38"/><g filter="url(#sh)" font-family="Trebuchet MS,Arial,sans-serif" fill="#253142"><rect x="64" y="100" width="188" height="250" rx="28" fill="#fff"/><text x="158" y="180" text-anchor="middle" font-size="72" font-weight="900">3</text><line x1="112" y1="218" x2="204" y2="218" stroke="#253142" stroke-width="7" stroke-linecap="round"/><text x="158" y="294" text-anchor="middle" font-size="72" font-weight="900">4</text><text x="310" y="238" text-anchor="middle" font-size="68" font-weight="900" fill="#5b9fc2">→</text><rect x="365" y="70" width="365" height="132" rx="28" fill="#fff"/><text x="548" y="154" text-anchor="middle" font-size="68" font-weight="900">0.75</text><rect x="365" y="248" width="365" height="132" rx="28" fill="#fff"/><text x="548" y="334" text-anchor="middle" font-size="68" font-weight="900">75%</text></g><text x="548" y="226" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="26" font-weight="900" fill="#507691" letter-spacing="2">DECIMAL • PERCENT</text></svg>