<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2400" viewBox="0 0 2200 2400">
  <defs>
    <pattern id="smallGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#b9d8ef" stroke-width="1.3" opacity="0.45"/>
    </pattern>
    <pattern id="bigGrid" width="240" height="240" patternUnits="userSpaceOnUse">
      <rect width="240" height="240" fill="url(#smallGrid)"/>
      <path d="M 240 0 L 0 0 0 240" fill="none" stroke="#9fc4df" stroke-width="2" opacity="0.55"/>
    </pattern>
    <style>
      .bg { fill: #fcfcf7; }
      .grid { fill: url(#bigGrid); }
      .margin { stroke: #e7a5a5; stroke-width: 4; opacity: 0.55; }
      .thin { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.24; }
      .txt { font-family: "Trebuchet MS", Arial, sans-serif; font-size: 52px; font-weight: 700; opacity: 0.24; }
      .small { font-size: 40px; }
      .tiny { font-size: 31px; }
      .purple { stroke: #9780d1; fill: #9780d1; }
      .green  { stroke: #76b489; fill: #76b489; }
      .blue   { stroke: #72a4c8; fill: #72a4c8; }
      .orange { stroke: #e59e7a; fill: #e59e7a; }
      .gold   { stroke: #d5b867; fill: #d5b867; }
      .pink   { stroke: #d88ea0; fill: #d88ea0; }
      .mint   { stroke: #84c5bb; fill: #84c5bb; }
    </style>
  </defs>

  <rect class="bg" width="2200" height="2400"/>
  <rect class="grid" width="2200" height="2400"/>
  <line class="margin" x1="140" y1="0" x2="140" y2="2400"/>

  <!-- top left -->
  <g transform="translate(220 130)">
    <text class="txt purple">3(x + 4) = 21</text>
    <line class="thin purple" x1="8" y1="76" x2="322" y2="76"/>
    <text class="txt purple small" x="26" y="146">x = 3</text>
  </g>

  <!-- top center -->
  <g transform="translate(890 110)">
    <ellipse class="thin orange" cx="88" cy="14" rx="88" ry="26"/>
    <rect class="thin orange" x="0" y="14" width="176" height="162"/>
    <ellipse class="thin orange" cx="88" cy="176" rx="88" ry="26"/>
    <text class="txt orange small" x="220" y="40">r= 3 cm</text>
    <text class="txt orange small" x="220" y="95">h = 8 cm</text>
    <text class="txt orange small" x="220" y="150">V = πr²j</text>
    <text class="txt orange tiny" x="220" y="200">V = 72΀ cm̳</text>
  </g>

  <!-- top right -->
  <g transform="translate(1650 130)">
    <text class="txt blue">4(x ∓ 2) = 2x + 8</text>
    <line class="thin blue" x1="8" y1="76" x2="386" y2="76"/>
    <text class="txt blue small" x="26" y="146">x = 8</text>
  </g>

  <!-- second row left -->
  <g transform="translate(210 470)">
    <path class="thin purple" d="M0,140 A140,140 0 0 1 280,140"/>
    <line class="thin purple" x1="0" y1="140" x2="280" y2="140"/>
    <line class="thin purple" x1="140" y1="140" x2="140" y2="12"/>
    <text class="txt purple small" x="128" y="78">r</text>
    <text class="txt purple small" x="0" y="210">P = άr' + 2r</text>
    <text class="txt purple tiny" x="0" y="258">if r = 6 cm, P = 6π + 12 cm</text>
  </g>

  <!-- second row center -->
  <g transform="translate(900 520)">
    <text class="txt mint">1 dm̳ = 1 L</text>
    <line class="thin mint" x1="10" y1="74" x2="208" y2="74"/>
    <text class="txt mint small" x="8" y="146">2500 cm̳ = 2.5 L</text>
    <text class="txt mint small" x="8" y="210">0.75 L = 750 cm̳</text>
  </g>

  <!-- second row right -->
  <g transform="translate(1620 460)">
    <line class="thin blue" x1="24" y1="220" x2="330" y2="220"/>
    <line class="thin blue" x1="60" y1="24" x2="60" y2="258"/>
    <path class="thin blue" d="M60,200 L140,170 L220,120 L300,80"/>
    <circle class="blue" cx="140" cy="170" r="7" opacity="0.24"/>
    <circle class="blue" cx="220" cy="120" r="7" opacity="0.24"/>
    <circle class="blue" cx="300" cy="80" r="7" opacity="0.24"/>
    <text class="txt blue tiny" x="10" y="304">y = x + 1</text>
  </g>

  <!-- third row left -->
  <g transform="translate(210 900)">
    <circle class="thin gold" cx="112" cy="112" r="98"/>
    <path class="thin gold" d="M112,112 L112,14 A98,98 0 0 1 210,112 Z"/>
    <text class="txt gold small" x="252" y="96">25%</text>
    <text class="txt gold tiny" x="252" y="150">½ = 0.25 = 25%</text>
  </g>

  <!-- third row center -->
  <g transform="translate(900 900)">
    <text class="txt green">2(3x − 1) = 16</text>
    <line class="thin green" x1="6" y1="76" x2="286" y2="76"/>
    <text class="txt green small" x="24" y="146">x = 3</text>
  </g>

  <!-- third row right -->
  <g transform="translate(1625 885)">
    <rect class="thin pink" x="0" y="0" width="170" height="100"/>
    <text class="txt pink small" x="210" y="42">A = lw</text>
    <text class="txt pink tiny" x="210" y="96">17 × 10 = 170 cm̲</text>
  </g>

  <!-- fourth row left -->
  <g transform="translate(220 1300)">
    <rect class="thin blue" x="0" y="40" width="94" height="94"/>
    <line class="thin blue" x1="0" y1="40" x2="44" y2="6"/>
    <line class="thin blue" x1="94" y1="40" x2="138" y2="6"/>
    <line class="thin blue" x1="94" y1="134" x2="138" y2="100"/>
    <line class="thin blue" x1="138" y1="6" x2="138" y2="100"/>
    <line class="thin blue" x1="44" y1="6" x2="138" y2="6"/>
    <line class="thin blue" x1="44" y1="6" x2="44" y2="100"/>
    <line class="thin blue" x1="44" y1="100" x2="138" y2="100"/>
    <line class="thin blue" x1="0" y1="134" x2="44" y2="100"/>
    <text class="txt blue small" x="180" y="48">1 m³ = 1000 L</text>
    <text class="txt blue tiny" x="180" y="98">0.4 mƳ = 400 L</text>
  </g>

  <!-- fourth row center -->
  <g transform="translate(900 1280)">
    <text class="txt purple">5a + 2a = 7a</text>
    <line class="thin purple" x1="10" y1="76" x2="286" y2="76"/>
    <text class="txt purple small" x="12" y="145">like terms</text>
  </g>

  <!-- fourth row right -->
  <g transform="translate(1610 1260)">
    <line class="thin mint" x1="20" y1="210" x2="20" y2="34"/>
    <line class="thin mint" x1="20" y1="210" x2="260" y2="210"/>
    <rect class="thin mint" x="70" y="150" width="48" height="60"/>
    <rect class="thin mint" x="140" y="110" width="48" height="100"/>
    <rect class="thin mint" x="210" y="70" width="48" height="140"/>
    <text class="txt mint tiny" x="16" y="270">bar graph</text>
  </g>

  <!-- bottom left -->
  <g transform="translate(220 1730)">
    <line class="thin orange" x1="20" y1="200" x2="300" y2="200"/>
    <line class="thin orange" x1="160" y1="20" x2="160" y2="240"/>
    <line class="thin orange" x1="160" y1="120" x2="250" y2="120"/>
    <line class="thin orange" x1="250" y1="120" x2="250" y2="200"/>
    <circle class="orange" cx="250" cy="120" r="7" opacity="0.24"/>
    <text class="txt orange tiny" x="262" y="128">(3, 2)</text>
  </g>

  <!-- bottom center -->
  <g transform="translate(910 1710)">
    <text class="txt gold">¾ = 0.75 = 75%</text>
    <path class="thin gold" d="M20,80 C40,28 82,28 102,70 C122,28 164,28 184,70 C204,28 246,28 266,70"/>
  </g>

  <!-- bottom right -->
  <g transform="translate(1605 1705)">
    <text class="txt green">6(x + 1) = 30</text>
    <line class="thin green" x1="10" y1="76" x2="274" y2="76"/>
    <text class="txt green small" x="22" y="146">x = 4</text>
  </g>

  <!-- small filler doodles -->
  <g transform="translate(700 380)">
    <path class="thin pink" d="M0,28 C10,8 34,8 44,28 C54,8 78,8 88,28"/>
  </g>
  <g transform="translate(1425 305)">
    <path class="thin purple" d="M0,18 L12,18 L16,0 L20,18 L32,18"/>
  </g>
  <g transform="translate(640 1030)">
    <circle class="mint" cx="0" cy="0" r="10" opacity="0.24"/>
  </g>
  <g transform="translate(1360 980)">
    <path class="thin green" d="M0,60 C18,20 48,20 62,46 C52,16 78,0 108,8"/>
  </g>
  <g transform="translate(760 1550)">
    <path class="thin blue" d="M0,50 L18,18 L36,50"/>
  </g>
  <g transform="translate(1440 1565)">
    <path class="thin pink" d="M22,44 C0,28 8,0 26,7 C36,12 38,20 38,20 C38,20 40,12 50,7 C68,0 76,28 52,44 L38,55 Z"/>
  </g>
</svg>