<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Finding the Whole from a Percent and a Part</title><desc id="d">Twenty five percent of an unknown whole equals thirty.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7fb"/><stop offset="1" stop-color="#dceef6"/></linearGradient></defs><rect width="640" height="360" rx="28" fill="url(#g)"/><text x="320" y="70" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="28" font-weight="900" fill="#356f89">FIND THE WHOLE</text><rect x="70" y="120" width="500" height="118" rx="20" fill="#fff" stroke="#74a7bd" stroke-width="4"/><text x="320" y="195" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="46" font-weight="900" fill="#293d48">25% of ? = 30</text><path d="M142 286 H498" stroke="#5b9fc2" stroke-width="5" stroke-linecap="round"/><text x="320" y="326" text-anchor="middle" font-family="Trebuchet MS,Arial" font-size="22" font-weight="900" fill="#487d95">percent + part → whole</text></svg>