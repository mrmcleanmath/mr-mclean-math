num-sci-cycle 4.8s ease-in-out both}.area-card:hover .num-fracexpr,.area-button:hover .num-fracexpr,.area-card.open .num-fracexpr{animation:num-frac-cycle 4.8s ease-in-out both}
.dice-stage{perspective:520px;overflow:visible}.dice-cube{--die-size:54px;--die-depth:27px;position:relative;width:var(--die-size);height:var(--die-size);display:block;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(28deg);will-change:transform}.dice-face{position:absolute;inset:0;width:var(--die-size);height:var(--die-size);display:block;border:2px solid #454951;border-radius:9px;background:linear-gradient(145deg,#fff,#e6e8ec);box-shadow:inset -5px -5px 8px rgba(0,0,0,.10),inset 4px 4px 6px rgba(255,255,255,.95);backface-visibility:hidden}.face-front{transform:translateZ(var(--die-depth))}.face-back{transform:rotateY(180deg) translateZ(var(--die-depth))}.face-right{transform:rotateY(90deg) translateZ(var(--die-depth))}.face-left{transform:rotateY(-90deg) translateZ(var(--die-depth))}.face-top{transform:rotateX(90deg) translateZ(var(--die-depth))}.face-bottom{transform:rotateX(-90deg) translateZ(var(--die-depth))}.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#444850;box-shadow:inset 1px 1px 1px rgba(0,0,0,.35)}.tl{left:9px;top:9px}.tr{right:9px;top:9px}.ml{left:9px;top:23px}.mr{right:9px;top:23px}.bl{left:9px;bottom:9px}.br{right:9px;bottom:9px}.center{left:50%;top:50%;transform:translate(-50%,-50%)}.area-card:hover .dice-cube,.area-button:hover .dice-cube,.area-card.open .dice-cube{animation:die-tumble-3d 1.05s cubic-bezier(.34,1.56,.64,1) both}

.concept-display{display:grid;grid-template-rows:0fr;margin-top:0;transition:grid-template-rows .34s ease,margin-top .34s ease}

.concept-panel{--accent:#777;position:relative;background:rgba(255,255,255,.93);border:2px solid color-mix(in srgb,var(--accent) 50%,#d5d8df);border-radius:22px;padding:22px;box-shadow:0 14px 30px rgba(45,52,68,.13)}

<script>
const areaData={
 number:{title:'Number & Operations',accent:'#fce5cd',html:`<a class="concept-card" href="prime-factorization.html"><div class="concept-symbol" style="font-weight:900;font-size:1.12rem;white-space:nowrap">30 = 2 × 3 × 5</div><div class="concept-copy"><h3>Prime Factorization</h3><p>Break composite numbers into a complete product of prime factors.</p></div><span class="practice-pill">Start Practice →</span></a>`},
 algebra:{title:'Algebra',accent:'#72ad61',html:`<a class="concept-card" href="adding-subtracting-algebraic-expressions.html"><div class="concept-symbol algebra-mini"><span>3x</span><span class="plus">+</span><span>2x</span></div><div class="concept-copy"><h3>Adding and Subtracting Algebraic Expressions</h3><p>Collect like terms and simplify expressions without brackets.</p></div><span class="practice-pill">Start Practice →</span></a>`},
 geometry:{title:'Geometry',accent:'#e4b42e',html:`<a class="concept-card" href="converting-cubic-units-liters.html"><div class="concept-symbol" style="font-weight:900;font-size:1.25rem">dm³ ↔ L</div><div class="concept-copy"><h3>Converting Between Cubic Units and Liters</h3><p>Convert between cubic units and capacity units using powers of ten.</p></div><span class="practice-pill">Start Practice →</span></a>`},
 ratio:{title:'Ratio, Proportion & Change',accent:'#5b9fc2',html:`<a class="concept-card" href="simplifying-fractions.html"><div class="concept-symbol concept-fraction-equation" style="font-weight:900;font-size:1.12rem"><span class="concept-stacked-fraction"><span>12</span><span class="concept-fraction-bar"></span><span>18</span></span><span class="concept-fraction-arrow">→</span><span class="concept-stacked-fraction"><span>2</span><span class="concept-fraction-bar"></span><span>3</span></span></div><div class="concept-copy"><h3>Simplifying Fractions</h3><p>Reduce fractions completely using the greatest common factor.</p></div><span class="practice-pill">Start Practice →</span></a>`},
 stats:{title:'Statistics & Probability',accent:'#8a6ac6',html:`<a class="concept-card" href="basic-probability.html"><div class="concept-symbol probability-thumb"><img src="probability-coin-flip.png" alt="Hand flipping a coin"></div><div class="concept-copy"><h3>Basic Probability</h3><p>Find probabilities using favorable outcomes and total outcomes.</p></div><span class="practice-pill">Start Practice →</span></a>`}
};
const cards=[...document.querySelectorAll('.area-card')],display=document.getElementById('conceptDisplay'),panel=document.getElementById('conceptPanel');
cards.forEach(card=>card.querySelector('.area-button').addEventListener('click',()=>{
 const key=card.dataset.area,opening=!card.classList.contains('open');
 cards.forEach(c=>{c.classList.remove('open');c.querySelector('.area-button').setAttribute('aria-expanded','false')});
 if(!opening){display.classList.remove('visible');return}
 card.classList.add('open');card.querySelector('.area-button').setAttribute('aria-expanded','true');
 const data=areaData[key];panel.style.setProperty('--accent',data.accent);panel.innerHTML=`<div class="concept-heading"><h2>${data.title} Practice</h2><span>Choose a concept to begin</span></div><div class="concept-list">${data.html}</div>`;
 display.classList.add('visible');
 setTimeout(()=>display.scrollIntoView({behavior:'smooth',block:'nearest'}),120);
}));
</script>
